name: Build road tiles

# Press "Run workflow" on the Actions tab to download the latest OS Open Roads and rebuild the tiles.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the shapefile reader
        run: pip install pyshp==2.3.1

      - name: Download OS Open Roads (GB, Shapefile, about 600 MB)
        run: |
          curl -fL --retry 3 --retry-delay 10 -o oproad.zip \
            "https://api.os.uk/downloads/v1/products/OpenRoads/downloads?area=GB&format=ESRI%C2%AE+Shapefile&redirect"
          ls -l oproad.zip
          # OS zips use absolute paths, so unzip warns (exit code 1). Only a real error (2 or more) stops the run.
          unzip -q oproad.zip -d oproad || [ $? -eq 1 ]
          rm oproad.zip
          find oproad -name "*RoadLink*.shp" | head -5
          find oproad -name "*RoadLink*.shp" | wc -l

      - name: Build the tiles
        run: |
          rm -rf docs/t
          python scripts/build_tiles.py oproad docs
          du -sh docs
          cat docs/meta.json

      - name: Save the tiles to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "Road tiles from OS Open Roads, built $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
